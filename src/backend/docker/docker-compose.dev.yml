# ============================================================================
# DEVELOPMENT USAGE GUIDE AND BEST PRACTICES
# ============================================================================
#
# QUICK START:
# 1. Copy .env.example to .env and configure development settings
# 2. docker-compose -f docker-compose.dev.yml up --build
# 3. Access Node.js app: http://localhost:3000
# 4. Access Flask app: http://localhost:5000
# 5. Debug Node.js: Connect IDE to localhost:9229
#
# DEVELOPMENT WORKFLOW:
# - Edit source code in ../src or ../flask-app for live reloading
# - Monitor logs: docker-compose -f docker-compose.dev.yml logs -f
# - Test endpoints: curl http://localhost:3000/hello && curl http://localhost:5000/hello
# - Debug: Use VS Code or Chrome DevTools for Node.js debugging
# - Cross-platform validation: Compare Node.js and Flask endpoint responses
#
# IDE INTEGRATION:
# VS Code launch.json for Node.js debugging:
# {
#   "type": "node",
#   "request": "attach",
#   "name": "Docker: Attach to Node",
#   "port": 9229,
#   "address": "localhost",
#   "remoteRoot": "/app"
# }
#
# PERFORMANCE TIPS:
# - Use named volumes for node_modules to improve startup times
# - Enable file watching polling for cross-platform compatibility
# - Monitor resource usage with docker stats
# - Use docker-compose logs for centralized log viewing
#
# TROUBLESHOOTING:
# - File watching issues: Ensure CHOKIDAR_USEPOLLING=true
# - Permission errors: Check user/group ownership in containers
# - Port conflicts: Modify DEV_PORT and FLASK_DEV_PORT in .env
# - Debug connection: Verify port 9229 mapping and firewall settings
#
# ============================================================================