# pytest.ini - Comprehensive Flask Testing Configuration
# Educational Flask vs Express.js Cross-Platform Testing Framework
# Provides complete pytest configuration equivalent to Jest/Mocha setup
# with ≥90% code coverage requirements and Flask-specific testing patterns

[tool:pytest]
# =============================================================================
# TEST DISCOVERY CONFIGURATION
# =============================================================================
# Configure pytest test discovery patterns for Flask application testing
# following pytest conventions equivalent to Jest testMatch patterns
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# =============================================================================
# EXECUTION OPTIONS AND COVERAGE CONFIGURATION
# =============================================================================
# Comprehensive pytest execution options with verbose output, coverage reporting,
# failure handling, and performance monitoring equivalent to Jest configuration
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --cov=src/backend/flask-app
    --cov-report=html:coverage/flask/html
    --cov-report=xml:coverage/flask/coverage.xml
    --cov-report=term-missing
    --cov-fail-under=90
    --cov-branch
    --no-cov-on-fail
    --durations=10
    --maxfail=5
    -p no:warnings

# =============================================================================
# CUSTOM TEST MARKERS
# =============================================================================
# Flask-specific test markers for comprehensive application testing
# equivalent to Jest test.describe categories and Mocha test organization
markers =
    unit: Unit tests for individual components and functions
    integration: Integration tests for component interactions and API endpoints
    e2e: End-to-end tests for complete Flask application workflows
    security: Security tests for Flask-Talisman validation and vulnerability testing
    performance: Performance tests for response time and load testing validation
    cross_platform: Cross-platform compatibility tests comparing Flask vs Express.js
    slow: Slow running tests that may take longer than usual to execute
    api: API endpoint tests for HTTP request/response validation
    blueprints: Flask blueprint tests for modular route testing
    middleware: Middleware tests for Flask-CORS, Flask-Talisman, and custom middleware
    config: Configuration tests for Flask application factory and environment testing
    fixtures: Test fixture validation and test data integrity testing

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
# Comprehensive test logging configuration for debugging and test execution
# monitoring equivalent to Jest verbose output and Mocha reporter options
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test log file configuration for detailed debugging and issue tracking
log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# =============================================================================
# TIMEOUT AND CACHE CONFIGURATION
# =============================================================================
# Test execution timeout configuration preventing hanging tests and ensuring
# reasonable execution times equivalent to Jest timeout settings
timeout = 300
timeout_method = thread

# pytest cache directory for test result caching and improved execution performance
# equivalent to Jest cache functionality for faster subsequent test runs
cache_dir = .pytest_cache

# =============================================================================
# WARNING FILTERS
# =============================================================================
# Warning filters to suppress non-critical warnings during test execution
# for clean output equivalent to Jest silent mode configuration
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:flask.*
    ignore::UserWarning:werkzeug.*

# =============================================================================
# FLASK-SPECIFIC TESTING CONFIGURATION
# =============================================================================
# Flask application testing configuration for proper test isolation
# and context-dependent testing equivalent to Express.js supertest setup

# Flask test client configuration for HTTP request testing
flask_app = app.create_app
flask_env = testing

# =============================================================================
# PYTEST PLUGIN CONFIGURATION
# =============================================================================
# Enable Flask-specific pytest plugins for comprehensive testing capabilities
# equivalent to Jest plugin ecosystem for React/Node.js testing

# pytest-flask configuration for Flask application context management
live_server_start = true
live_server_port = 0
live_server_host = 127.0.0.1

# pytest-asyncio configuration for asynchronous testing support
asyncio_mode = auto

# pytest-xdist configuration for parallel test execution
dist = loadfile
numprocesses = auto

# =============================================================================
# COVERAGE EXCLUSION PATTERNS
# =============================================================================
# Files and patterns to exclude from coverage analysis to focus on
# application code equivalent to Jest collectCoverageFrom configuration
[coverage:run]
source = src/backend/flask-app
omit = 
    tests/*
    conftest.py
    */tests/*
    */__pycache__/*
    */venv/*
    */migrations/*
    */instance/*
    .pytest_cache/*

# Coverage branch analysis configuration for comprehensive code path testing
branch = true

# =============================================================================
# COVERAGE REPORTING CONFIGURATION
# =============================================================================
# Coverage report configuration with multiple output formats for different
# use cases equivalent to Jest coverage reporters
[coverage:report]
# Minimum coverage thresholds - fail if coverage falls below these values
fail_under = 90
show_missing = true
skip_covered = false
precision = 2

# Coverage report formatting for clear readability
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

# =============================================================================
# HTML COVERAGE REPORT CONFIGURATION
# =============================================================================
# HTML coverage report configuration for detailed visual analysis
# equivalent to Jest HTML coverage reports
[coverage:html]
directory = coverage/flask/html
title = Flask Application Test Coverage Report
show_contexts = true

# =============================================================================
# XML COVERAGE REPORT CONFIGURATION
# =============================================================================
# XML coverage report configuration for CI/CD integration
# equivalent to Jest XML coverage output for Codecov integration
[coverage:xml]
output = coverage/flask/coverage.xml

# =============================================================================
# FLASK TESTING BEST PRACTICES CONFIGURATION
# =============================================================================
# Additional configuration for Flask application testing best practices
# including security testing, performance validation, and cross-platform testing

# Flask-Talisman security testing configuration
# Security header validation equivalent to Helmet.js testing in Express.js
talisman_force_https = false
talisman_force_https_permanent = false

# Flask-CORS testing configuration for cross-origin request validation
cors_testing_origin = http://localhost:3000

# Performance testing configuration for response time measurement
# Target response time < 100ms equivalent to Express.js performance requirements
performance_threshold_ms = 100
performance_concurrent_requests = 100

# Cross-platform testing configuration for Flask vs Express.js comparison
cross_platform_baseline_url = http://localhost:3000
cross_platform_comparison_enabled = true

# Test data management configuration for consistent and reliable test execution
test_data_factory_enabled = true
test_data_cleanup_enabled = true
test_fixtures_auto_load = true

# Flask application factory testing configuration
flask_app_factory_testing = true
flask_blueprint_isolation = true
flask_context_testing = true

# Educational testing configuration for Flask vs Express.js learning outcomes
educational_mode = true
tutorial_phase = comprehensive_testing
framework_comparison = flask_vs_express
testing_pattern_demonstration = pytest_vs_jest_mocha

# =============================================================================
# CI/CD INTEGRATION CONFIGURATION
# =============================================================================
# Configuration optimized for CI/CD pipeline execution with GitHub Actions
# compatibility and automated quality gates
ci_mode = auto
parallel_execution = true
coverage_trending = true
quality_gates_enabled = true

# Security scanning integration for vulnerability detection during testing
security_scan_enabled = true
dependency_scan_enabled = true
license_compliance_check = true

# Performance monitoring integration for response time tracking and optimization
performance_monitoring = true
memory_usage_tracking = true
resource_optimization = true

# =============================================================================
# EDUCATIONAL VALUE CONFIGURATION
# =============================================================================
# Configuration demonstrating Flask testing patterns equivalent to Jest/Mocha
# for comprehensive full-stack web development education
tutorial_integration = flask_comprehensive_testing
learning_objectives = flask_testing_patterns,cross_platform_validation,security_testing
complexity_level = intermediate
prerequisites = flask_basics,pytest_fundamentals,http_testing
next_steps = advanced_flask_testing,production_deployment,performance_optimization