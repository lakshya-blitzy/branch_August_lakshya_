              "deployment_execution": "$([ "${{ needs.zero-downtime-deployment.result }}" == "success" ] && echo "zero-downtime-success" || [ "${{ needs.blue-green-deployment.result }}" == "success" ] && echo "blue-green-success" || echo "deployment-failed")",
              "health_validation": "${{ needs.deployment-validation.result }}",
              "rollback_execution": "${{ needs.rollback-deployment.result }}",
              "overall_success": $([ "${{ steps.orchestration-summary.outputs.status }}" == "success" ] && echo "true" || echo "false")
            },
            "learning_objectives_achieved": [
