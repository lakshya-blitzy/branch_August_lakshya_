# GitHub Actions v4 - Comprehensive Testing Pipeline for Node.js Tutorial Project
# Educational CI/CD workflow demonstrating Jest vs Mocha frameworks, cross-platform testing,
# security validation, performance benchmarking, and production-ready deployment practices

name: "Comprehensive Testing Pipeline"

# Workflow trigger configuration for automated and manual testing execution
on:
  # Automatic triggers for comprehensive validation
  push:
    branches: 
      - main
      - develop
      - 'feature/*'
      - 'hotfix/*'
      - 'release/*'
    paths:
      - 'src/backend/**'
      - 'test/**'
      - '*.js'
      - '*.json'
      - '*.yml'
      - '*.yaml'
      - 'package*.json'
      - 'jest.config.js'
      - '.mocharc.json'
      - '.eslintrc.json'
      - 'ecosystem.config.js'
    # Exclude documentation and non-functional changes
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  
  # Pull request validation with comprehensive testing
  pull_request:
    branches: 
      - main
      - develop
    types: 
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'src/backend/**'
      - 'test/**'
      - '*.js'
      - '*.json'
      - '*.yml'
      - 'package*.json'
  
  # Manual workflow dispatch with educational customization options
  workflow_dispatch:
    inputs:
      test_framework:
        description: 'Testing framework to execute (educational comparison)'
        required: false
        default: 'both'
        type: choice
        options:
          - 'jest'
          - 'mocha'
          - 'both'
      node_version:
        description: 'Node.js version for testing compatibility'
        required: false
        default: '22.x'
        type: choice
        options:
          - '18.x'
          - '20.x'
          - '22.x'
          - 'all'
      coverage_threshold:
        description: 'Coverage threshold percentage (educational quality gate)'
        required: false
        default: '90'
        type: number
        min: 70
        max: 100
      enable_performance:
        description: 'Enable performance testing and benchmarking'
        required: false
        default: true
        type: boolean
      enable_security:
        description: 'Enable security testing and vulnerability scanning'
        required: false
        default: true
        type: boolean
      enable_cross_platform:
        description: 'Enable cross-platform compatibility testing'
        required: false
        default: true
        type: boolean
      educational_mode:
        description: 'Educational insights detail level'
        required: false
        default: 'intermediate'
        type: choice
        options:
          - 'beginner'
          - 'intermediate'
          - 'advanced'

# Global environment variables for consistent testing configuration
env:
  NODE_ENV: test
  CI: true
  FORCE_COLOR: '1'
  NPM_CONFIG_COLOR: always
  NPM_CONFIG_PROGRESS: false
  JEST_WORKERS: '2'
  MOCHA_WORKERS: '2'
  COVERAGE_THRESHOLD: ${{ github.event.inputs.coverage_threshold || '90' }}
  EDUCATIONAL_MODE: ${{ github.event.inputs.educational_mode || 'intermediate' }}
  ENABLE_PERFORMANCE: ${{ github.event.inputs.enable_performance || 'true' }}
  ENABLE_SECURITY: ${{ github.event.inputs.enable_security || 'true' }}
  ENABLE_CROSS_PLATFORM: ${{ github.event.inputs.enable_cross_platform || 'true' }}

# Workflow permissions for comprehensive testing and reporting
permissions:
  contents: read          # Repository code access for testing
  actions: read          # Workflow and action permissions
  checks: write          # Test result publication
  pull-requests: write   # PR comment and status updates
  security-events: write # Security scan result publication
  issues: write          # Issue creation for test failures
  deployments: write     # Deployment status updates

# Workflow-level concurrency control for resource optimization
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Environment Setup and Configuration Validation Job
  setup-environment:
    name: "🔧 Environment Setup & Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      node-matrix: ${{ steps.node-matrix.outputs.matrix }}
      os-matrix: ${{ steps.os-matrix.outputs.matrix }}
      framework-matrix: ${{ steps.framework-matrix.outputs.matrix }}
      cache-key: ${{ steps.cache-key.outputs.key }}
      test-config: ${{ steps.test-config.outputs.config }}
    
    steps:
      # Repository checkout with full history for comprehensive analysis
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      
      # Dynamic Node.js version matrix generation based on workflow inputs
      - name: "🎯 Generate Node.js Version Matrix"
        id: node-matrix
        run: |
          if [[ "${{ github.event.inputs.node_version }}" == "all" ]] || [[ -z "${{ github.event.inputs.node_version }}" ]]; then
            echo "matrix=[\"18.x\", \"20.x\", \"22.x\"]" >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"${{ github.event.inputs.node_version }}\"]" >> $GITHUB_OUTPUT
          fi
          echo "🎯 Node.js matrix: $(cat $GITHUB_OUTPUT | grep matrix | cut -d'=' -f2)"
      
      # Operating system matrix for cross-platform compatibility testing
      - name: "🖥️ Generate OS Matrix"
        id: os-matrix
        run: |
          # Educational matrix showing cross-platform compatibility
          echo "matrix=[\"ubuntu-latest\", \"windows-latest\", \"macos-latest\"]" >> $GITHUB_OUTPUT
          echo "🖥️ OS matrix: $(cat $GITHUB_OUTPUT | grep matrix | cut -d'=' -f2)"
      
      # Testing framework matrix based on educational comparison requirements
      - name: "🧪 Generate Framework Matrix"
        id: framework-matrix
        run: |
          case "${{ github.event.inputs.test_framework }}" in
            "jest")
              echo "matrix=[\"jest\"]" >> $GITHUB_OUTPUT
              ;;
            "mocha")
              echo "matrix=[\"mocha\"]" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "matrix=[\"jest\", \"mocha\"]" >> $GITHUB_OUTPUT
              ;;
          esac
          echo "🧪 Framework matrix: $(cat $GITHUB_OUTPUT | grep matrix | cut -d'=' -f2)"
      
      # Generate cache key for dependency optimization
      - name: "🔑 Generate Cache Key"
        id: cache-key
        run: |
          CACHE_KEY="node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}"
          echo "key=$CACHE_KEY" >> $GITHUB_OUTPUT
          echo "🔑 Cache key: $CACHE_KEY"
      
      # Test configuration generation with educational parameters
      - name: "⚙️ Generate Test Configuration"
        id: test-config
        run: |
          CONFIG=$(cat << EOF
          {
            "coverage_threshold": ${{ env.COVERAGE_THRESHOLD }},
            "educational_mode": "${{ env.EDUCATIONAL_MODE }}",
            "performance_enabled": ${{ env.ENABLE_PERFORMANCE }},
            "security_enabled": ${{ env.ENABLE_SECURITY }},
            "cross_platform_enabled": ${{ env.ENABLE_CROSS_PLATFORM }},
            "parallel_execution": true,
            "detailed_reporting": true
          }
          EOF
          )
          echo "config<<EOF" >> $GITHUB_OUTPUT
          echo "$CONFIG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "⚙️ Test configuration generated"

  # Jest Testing Framework Job - Comprehensive All-in-One Approach
  jest-comprehensive-testing:
    name: "🃏 Jest Testing: ${{ matrix.os }} | Node ${{ matrix.node }}"
    runs-on: ${{ matrix.os }}
    needs: setup-environment
    timeout-minutes: 20
    if: contains(fromJson(needs.setup-environment.outputs.framework-matrix), 'jest')
    
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.setup-environment.outputs.os-matrix) }}
        node: ${{ fromJson(needs.setup-environment.outputs.node-matrix) }}
        include:
          # Educational configuration variations for different environments
          - os: ubuntu-latest
            node: "22.x"
            coverage-reporter: "lcov"
            educational-focus: "ci-optimization"
          - os: windows-latest
            node: "20.x"
            coverage-reporter: "cobertura"
            educational-focus: "cross-platform"
          - os: macos-latest
            node: "18.x"
            coverage-reporter: "json"
            educational-focus: "compatibility"
    
    steps:
      # Repository checkout with clean state
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      # Node.js environment setup with caching optimization
      - name: "⚡ Setup Node.js ${{ matrix.node }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: 'src/backend/package-lock.json'
          registry-url: 'https://registry.npmjs.org'
      
      # Dependency caching for CI/CD performance optimization
      - name: "💾 Cache Dependencies"
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ~/.cache
            node_modules
            src/backend/node_modules
          key: ${{ needs.setup-environment.outputs.cache-key }}-${{ matrix.os }}-${{ matrix.node }}
          restore-keys: |
            ${{ needs.setup-environment.outputs.cache-key }}-${{ matrix.os }}-
            ${{ needs.setup-environment.outputs.cache-key }}-
      
      # Install dependencies with production-ready configuration
      - name: "📦 Install Dependencies"
        working-directory: src/backend
        run: |
          npm ci --production=false --audit --fund
          echo "📦 Dependencies installed successfully"
          npm list --depth=0 || true
      
      # Validate Jest configuration and test environment
      - name: "🔧 Validate Jest Configuration"
        working-directory: src/backend
        run: |
          echo "🔧 Validating Jest configuration..."
          node -e "
            const config = require('./jest/jest.config.js');
            console.log('✅ Jest configuration loaded successfully');
            console.log('📊 Coverage thresholds:', JSON.stringify(config.coverageThreshold, null, 2));
            console.log('🎯 Test patterns:', JSON.stringify(config.testMatch, null, 2));
          "
      
      # Execute Jest test suite with comprehensive coverage analysis
      - name: "🧪 Execute Jest Test Suite"
        working-directory: src/backend
        run: |
          echo "🧪 Starting Jest test execution..."
          
          # Execute tests with detailed reporting
          npm run test:jest -- \
            --coverage \
            --coverageReporters=text \
            --coverageReporters=json \
            --coverageReporters=${{ matrix.coverage-reporter || 'lcov' }} \
            --coverageDirectory=coverage/jest \
            --maxWorkers=${{ env.JEST_WORKERS }} \
            --verbose \
            --testTimeout=10000 \
            --detectOpenHandles \
            --forceExit \
            --passWithNoTests \
            --bail=false \
            --ci
          
          echo "✅ Jest test execution completed"
      
      # Generate Jest educational insights and performance analysis
      - name: "💡 Generate Jest Educational Insights"
        working-directory: src/backend
        run: |
          echo "💡 Generating Jest educational insights..."
          
          # Create insights directory
          mkdir -p insights/jest
          
          # Generate Jest-specific educational content
          cat > insights/jest/framework-analysis.md << EOF
          # Jest Testing Framework Analysis
          
          ## Configuration Approach: All-in-One Solution
          - **Built-in Coverage**: Native code coverage without external tools
          - **Parallel Execution**: Automatic worker process optimization
          - **Snapshot Testing**: Built-in snapshot testing capabilities
          - **Mocking System**: Comprehensive mocking and stubbing features
          
          ## Performance Characteristics
          - **OS**: ${{ matrix.os }}
          - **Node.js**: ${{ matrix.node }}
          - **Workers**: ${{ env.JEST_WORKERS }}
          - **Educational Focus**: ${{ matrix.educational-focus }}
          
          ## Coverage Analysis
          $(cat coverage/jest/coverage-summary.json 2>/dev/null | jq -r '.total | "- Statements: \(.statements.pct)%\n- Branches: \(.branches.pct)%\n- Functions: \(.functions.pct)%\n- Lines: \(.lines.pct)%"' || echo "Coverage data will be available after test execution")
          
          ## Learning Outcomes
          - Understanding Jest's zero-configuration philosophy
          - Implementing comprehensive test coverage strategies
          - Optimizing test performance with parallel execution
          - Leveraging built-in mocking and assertion capabilities
          EOF
          
          echo "✅ Jest educational insights generated"
      
      # Upload Jest test results and coverage artifacts
      - name: "📊 Upload Jest Test Results"
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: jest-results-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            src/backend/coverage/jest/
            src/backend/test-results/jest/
            src/backend/insights/jest/
          retention-days: 30
      
      # Upload coverage to Codecov for comprehensive analysis
      - name: "📈 Upload Jest Coverage to Codecov"
        uses: codecov/codecov-action@v3
        if: success()
        with:
          file: src/backend/coverage/jest/lcov.info
          flags: jest,${{ matrix.os }},node${{ matrix.node }}
          name: jest-${{ matrix.os }}-node${{ matrix.node }}
          fail_ci_if_error: false
          verbose: true
          directory: src/backend
          env_vars: OS,NODE_VERSION
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          OS: ${{ matrix.os }}
          NODE_VERSION: ${{ matrix.node }}

  # Mocha Testing Framework Job - Modular and Flexible Approach
  mocha-modular-testing:
    name: "☕ Mocha Testing: ${{ matrix.os }} | Node ${{ matrix.node }}"
    runs-on: ${{ matrix.os }}
    needs: setup-environment
    timeout-minutes: 20
    if: contains(fromJson(needs.setup-environment.outputs.framework-matrix), 'mocha')
    
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.setup-environment.outputs.os-matrix) }}
        node: ${{ fromJson(needs.setup-environment.outputs.node-matrix) }}
        coverage-tool: ["c8", "nyc"]
        include:
          # Educational matrix for different coverage approaches
          - os: ubuntu-latest
            node: "22.x"
            coverage-tool: "c8"
            educational-focus: "modern-tooling"
          - os: windows-latest
            node: "20.x"
            coverage-tool: "nyc"
            educational-focus: "traditional-tooling"
          - os: macos-latest
            node: "18.x"
            coverage-tool: "c8"
            educational-focus: "compatibility"
        exclude:
          # Reduce matrix size for efficiency while maintaining educational value
          - os: "macos-latest"
            coverage-tool: "nyc"
    
    steps:
      # Repository checkout with clean state
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      # Node.js environment setup with version-specific optimizations
      - name: "⚡ Setup Node.js ${{ matrix.node }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: 'src/backend/package-lock.json'
          registry-url: 'https://registry.npmjs.org'
      
      # Restore dependency cache for performance optimization
      - name: "💾 Restore Dependencies Cache"
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ~/.cache
            node_modules
            src/backend/node_modules
          key: ${{ needs.setup-environment.outputs.cache-key }}-${{ matrix.os }}-${{ matrix.node }}
          restore-keys: |
            ${{ needs.setup-environment.outputs.cache-key }}-${{ matrix.os }}-
            ${{ needs.setup-environment.outputs.cache-key }}-
      
      # Install dependencies with Mocha-specific tools
      - name: "📦 Install Dependencies with Coverage Tools"
        working-directory: src/backend
        run: |
          npm ci --production=false --audit --fund
          
          # Install coverage tool based on matrix
          if [[ "${{ matrix.coverage-tool }}" == "c8" ]]; then
            echo "📦 Installing C8 for modern V8 coverage..."
            npm install --save-dev c8@latest
          else
            echo "📦 Installing NYC for traditional coverage..."
            npm install --save-dev nyc@latest
          fi
          
          echo "✅ Dependencies and coverage tools installed"
          npm list --depth=0 | grep -E "(mocha|c8|nyc)" || true
      
      # Validate Mocha configuration and test environment
      - name: "🔧 Validate Mocha Configuration"
        working-directory: src/backend
        run: |
          echo "🔧 Validating Mocha configuration..."
          
          # Validate .mocharc.json configuration
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('./mocha/.mocharc.json', 'utf8'));
            console.log('✅ Mocha configuration loaded successfully');
            console.log('📁 Test specs:', JSON.stringify(config.spec, null, 2));
            console.log('📊 Reporter:', config.reporter);
            console.log('⏱️ Timeout:', config.timeout + 'ms');
          "
          
          # Validate coverage tool configuration
          if [[ "${{ matrix.coverage-tool }}" == "c8" ]]; then
            echo "🔧 Validating C8 configuration..."
            c8 --version
          else
            echo "🔧 Validating NYC configuration..."
            nyc --version
          fi
      
      # Execute Mocha test suite with external coverage analysis
      - name: "🧪 Execute Mocha Test Suite with ${{ matrix.coverage-tool }}"
        working-directory: src/backend
        run: |
          echo "🧪 Starting Mocha test execution with ${{ matrix.coverage-tool }}..."
          
          # Create coverage directory
          mkdir -p coverage/mocha
          
          # Execute tests with appropriate coverage tool
          if [[ "${{ matrix.coverage-tool }}" == "c8" ]]; then
            echo "🧪 Running Mocha with C8 coverage..."
            c8 \
              --reporter=text \
              --reporter=json \
              --reporter=lcov \
              --reports-dir=coverage/mocha \
              --check-coverage \
              --statements=${{ env.COVERAGE_THRESHOLD }} \
              --branches=85 \
              --functions=95 \
              --lines=${{ env.COVERAGE_THRESHOLD }} \
              npm run test:mocha
          else
            echo "🧪 Running Mocha with NYC coverage..."
            nyc \
              --reporter=text \
              --reporter=json \
              --reporter=lcov \
              --report-dir=coverage/mocha \
              --check-coverage \
              --statements=${{ env.COVERAGE_THRESHOLD }} \
              --branches=85 \
              --functions=95 \
              --lines=${{ env.COVERAGE_THRESHOLD }} \
              npm run test:mocha
          fi
          
          echo "✅ Mocha test execution completed"
      
      # Generate Mocha educational insights and modular analysis
      - name: "💡 Generate Mocha Educational Insights"
        working-directory: src/backend
        run: |
          echo "💡 Generating Mocha educational insights..."
          
          # Create insights directory
          mkdir -p insights/mocha
          
          # Generate Mocha-specific educational content
          cat > insights/mocha/framework-analysis.md << EOF
          # Mocha Testing Framework Analysis
          
          ## Configuration Approach: Modular and Flexible
          - **External Coverage**: Using ${{ matrix.coverage-tool }} for coverage analysis
          - **Flexible Reporters**: Multiple reporter options for different use cases
          - **Modular Architecture**: Plugin-based ecosystem for customization
          - **Assertion Library**: Choice of assertion libraries (Chai, Should, etc.)
          
          ## Performance Characteristics
          - **OS**: ${{ matrix.os }}
          - **Node.js**: ${{ matrix.node }}
          - **Coverage Tool**: ${{ matrix.coverage-tool }}
          - **Educational Focus**: ${{ matrix.educational-focus }}
          
          ## Coverage Analysis
          $(cat coverage/mocha/coverage-summary.json 2>/dev/null | jq -r '.total | "- Statements: \(.statements.pct)%\n- Branches: \(.branches.pct)%\n- Functions: \(.functions.pct)%\n- Lines: \(.lines.pct)%"' || echo "Coverage data will be available after test execution")
          
          ## Learning Outcomes
          - Understanding Mocha's modular testing philosophy
          - Comparing different coverage tools (C8 vs NYC)
          - Implementing flexible test configurations
          - Leveraging plugin ecosystem for customization
          EOF
          
          echo "✅ Mocha educational insights generated"
      
      # Upload Mocha test results and coverage artifacts
      - name: "📊 Upload Mocha Test Results"
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: mocha-results-${{ matrix.os }}-node${{ matrix.node }}-${{ matrix.coverage-tool }}
          path: |
            src/backend/coverage/mocha/
            src/backend/test-results/mocha/
            src/backend/insights/mocha/
          retention-days: 30
      
      # Upload coverage to Codecov with framework-specific flags
      - name: "📈 Upload Mocha Coverage to Codecov"
        uses: codecov/codecov-action@v3
        if: success()
        with:
          file: src/backend/coverage/mocha/lcov.info
          flags: mocha,${{ matrix.os }},node${{ matrix.node }},${{ matrix.coverage-tool }}
          name: mocha-${{ matrix.os }}-node${{ matrix.node }}-${{ matrix.coverage-tool }}
          fail_ci_if_error: false
          verbose: true
          directory: src/backend
          env_vars: OS,NODE_VERSION,COVERAGE_TOOL
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          OS: ${{ matrix.os }}
          NODE_VERSION: ${{ matrix.node }}
          COVERAGE_TOOL: ${{ matrix.coverage-tool }}

  # Cross-Platform Compatibility Testing Job
  cross-platform-validation:
    name: "🔄 Cross-Platform Validation"
    runs-on: ubuntu-latest
    needs: [setup-environment, jest-comprehensive-testing, mocha-modular-testing]
    timeout-minutes: 15
    if: ${{ env.ENABLE_CROSS_PLATFORM == 'true' }}
    
    steps:
      # Repository checkout for cross-platform analysis
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      # Setup Node.js for cross-platform analysis
      - name: "⚡ Setup Node.js for Analysis"
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'src/backend/package-lock.json'
      
      # Download test artifacts from all framework executions
      - name: "📥 Download Test Artifacts"
        uses: actions/download-artifact@v3
        with:
          path: artifacts/
      
      # Install dependencies for cross-platform analysis
      - name: "📦 Install Analysis Dependencies"
        working-directory: src/backend
        run: |
          npm ci --production=false
          echo "📦 Analysis dependencies installed"
      
      # Setup Python environment for Flask comparison (educational)
      - name: "🐍 Setup Python for Flask Comparison"
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # Install Flask dependencies for cross-platform testing
      - name: "🌶️ Install Flask Dependencies"
        run: |
          echo "🌶️ Installing Flask for cross-platform comparison..."
          pip install flask==2.3.3 flask-cors==4.0.0 pytest==7.4.2 pytest-cov==4.1.0
          echo "✅ Flask dependencies installed for educational comparison"
      
      # Execute cross-platform compatibility validation
      - name: "🔄 Execute Cross-Platform Validation"
        working-directory: src/backend
        run: |
          echo "🔄 Starting cross-platform compatibility validation..."
          
          # Create cross-platform analysis directory
          mkdir -p insights/cross-platform
          
          # Execute cross-platform validation script
          node scripts/test.js --cross-platform --educational-mode=${{ env.EDUCATIONAL_MODE }}
          
          echo "✅ Cross-platform validation completed"
      
      # Generate cross-platform educational insights
      - name: "💡 Generate Cross-Platform Insights"
        run: |
          echo "💡 Generating cross-platform educational insights..."
          
          cat > src/backend/insights/cross-platform/analysis.md << EOF
          # Cross-Platform Compatibility Analysis
          
          ## Node.js Express vs Flask Comparison
          
          ### API Endpoint Parity
          - **GET /hello**: ✅ Available in both implementations
          - **GET /health**: ✅ Available in both implementations
          - **GET /good-evening**: ⚠️ Node.js specific (educational example)
          
          ### Response Format Consistency
          - **JSON Structure**: Consistent across platforms
          - **HTTP Status Codes**: Standardized responses
          - **Error Handling**: Similar patterns implemented
          
          ### Performance Characteristics
          - **Node.js**: Optimized for concurrent connections
          - **Flask**: Python-based, suitable for rapid development
          - **Educational Value**: Demonstrates different runtime characteristics
          
          ### Security Implementation
          - **Node.js**: Helmet.js middleware for security headers
          - **Flask**: Flask-Talisman equivalent implementation
          - **Cross-Platform**: Consistent security posture
          
          ## Learning Outcomes
          - Understanding API design consistency across platforms
          - Implementing feature parity validation
          - Comparing runtime performance characteristics
          - Maintaining security standards across technology stacks
          EOF
          
          echo "✅ Cross-platform insights generated"
      
      # Upload cross-platform validation results
      - name: "📊 Upload Cross-Platform Results"
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: cross-platform-validation
          path: |
            src/backend/insights/cross-platform/
            src/backend/test-results/cross-platform/
          retention-days: 30

  # Security Testing and Vulnerability Scanning Job
  security-comprehensive-testing:
    name: "🔒 Security Testing & Vulnerability Scanning"
    runs-on: ubuntu-latest
    needs: setup-environment
    timeout-minutes: 15
    if: ${{ env.ENABLE_SECURITY == 'true' }}
    
    steps:
      # Repository checkout for security analysis
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      # Setup Node.js for security testing
      - name: "⚡ Setup Node.js for Security Testing"
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'src/backend/package-lock.json'
      
      # Install dependencies for security testing
      - name: "📦 Install Dependencies"
        working-directory: src/backend
        run: |
          npm ci --production=false --audit
          echo "📦 Dependencies installed with security audit"
      
      # Execute comprehensive dependency vulnerability scanning
      - name: "🔍 Dependency Vulnerability Scanning"
        working-directory: src/backend
        run: |
          echo "🔍 Starting dependency vulnerability scanning..."
          
          # Create security results directory
          mkdir -p security-results
          
          # Run npm audit with detailed output
          echo "📊 Running npm audit..."
          npm audit --audit-level=moderate --json > security-results/npm-audit.json || true
          npm audit --audit-level=moderate > security-results/npm-audit.txt || true
          
          # Check for critical vulnerabilities
          CRITICAL_COUNT=$(cat security-results/npm-audit.json | jq -r '.metadata.vulnerabilities.critical // 0')
          HIGH_COUNT=$(cat security-results/npm-audit.json | jq -r '.metadata.vulnerabilities.high // 0')
          
          echo "🚨 Critical vulnerabilities: $CRITICAL_COUNT"
          echo "⚠️ High vulnerabilities: $HIGH_COUNT"
          
          # Fail if critical vulnerabilities found
          if [[ $CRITICAL_COUNT -gt 0 ]]; then
            echo "❌ Critical vulnerabilities detected - failing security gate"
            exit 1
          fi
          
          echo "✅ Dependency vulnerability scanning completed"
      
      # Validate Helmet.js security middleware configuration
      - name: "🛡️ Validate Helmet.js Security Configuration"
        working-directory: src/backend
        run: |
          echo "🛡️ Validating Helmet.js security configuration..."
          
          # Start the application in test mode
          NODE_ENV=test npm start &
          APP_PID=$!
          
          # Wait for application to start
          sleep 5
          
          # Test security headers
          echo "🔍 Testing security headers..."
          curl -I http://localhost:3000/health | tee security-results/security-headers.txt
          
          # Validate specific security headers
          if grep -q "X-Content-Type-Options: nosniff" security-results/security-headers.txt; then
            echo "✅ X-Content-Type-Options header present"
          else
            echo "❌ X-Content-Type-Options header missing"
          fi
          
          if grep -q "X-Frame-Options: DENY" security-results/security-headers.txt; then
            echo "✅ X-Frame-Options header present"
          else
            echo "❌ X-Frame-Options header missing"
          fi
          
          if grep -q "Strict-Transport-Security" security-results/security-headers.txt; then
            echo "✅ HSTS header present"
          else
            echo "⚠️ HSTS header not present (expected in production)"
          fi
          
          # Stop the application
          kill $APP_PID || true
          
          echo "✅ Helmet.js security validation completed"
      
      # Content Security Policy (CSP) validation
      - name: "🔐 Content Security Policy Validation"
        working-directory: src/backend
        run: |
          echo "🔐 Validating Content Security Policy..."
          
          # Test CSP configuration
          node -e "
            const app = require('./app.js');
            const cspConfig = require('./security/csp.config.js');
            console.log('✅ CSP configuration loaded successfully');
            console.log('📋 CSP directives:', Object.keys(cspConfig.directives));
          "
          
          echo "✅ CSP validation completed"
      
      # Generate security testing educational insights
      - name: "💡 Generate Security Educational Insights"
        working-directory: src/backend
        run: |
          echo "💡 Generating security educational insights..."
          
          mkdir -p insights/security
          
          cat > insights/security/analysis.md << EOF
          # Security Testing Analysis
          
          ## Dependency Vulnerability Scanning
          - **Tool**: npm audit (built-in Node.js security scanning)
          - **Scope**: All dependencies and transitive dependencies
          - **Thresholds**: Zero tolerance for critical vulnerabilities
          
          ## Helmet.js Security Middleware
          - **X-Content-Type-Options**: Prevents MIME type sniffing
          - **X-Frame-Options**: Prevents clickjacking attacks
          - **X-XSS-Protection**: XSS filtering (legacy browsers)
          - **Strict-Transport-Security**: HTTPS enforcement
          - **Content-Security-Policy**: Resource loading restrictions
          
          ## Security Headers Validation
          $(cat security-results/security-headers.txt | head -20)
          
          ## Vulnerability Summary
          $(cat security-results/npm-audit.txt | head -10)
          
          ## Learning Outcomes
          - Understanding dependency vulnerability management
          - Implementing security headers with Helmet.js
          - Configuring Content Security Policy effectively
          - Establishing security testing automation
          - Monitoring and responding to security advisories
          EOF
          
          echo "✅ Security educational insights generated"
      
      # Upload security testing results
      - name: "📊 Upload Security Results"
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-testing-results
          path: |
            src/backend/security-results/
            src/backend/insights/security/
          retention-days: 90

  # Performance Testing and Benchmarking Job
  performance-benchmarking:
    name: "⚡ Performance Testing & Benchmarking"
    runs-on: ubuntu-latest
    needs: setup-environment
    timeout-minutes: 20
    if: ${{ env.ENABLE_PERFORMANCE == 'true' }}
    
    steps:
      # Repository checkout for performance testing
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      # Setup Node.js for performance testing
      - name: "⚡ Setup Node.js for Performance Testing"
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'src/backend/package-lock.json'
      
      # Install dependencies including performance testing tools
      - name: "📦 Install Performance Testing Dependencies"
        working-directory: src/backend
        run: |
          npm ci --production=false
          
          # Install additional performance testing tools
          npm install --save-dev artillery@latest autocannon@latest
          
          echo "📦 Performance testing dependencies installed"
      
      # Execute response time benchmarking
      - name: "🚀 Response Time Benchmarking"
        working-directory: src/backend
        run: |
          echo "🚀 Starting response time benchmarking..."
          
          # Create performance results directory
          mkdir -p performance-results
          
          # Start application in production mode
          NODE_ENV=production npm start &
          APP_PID=$!
          
          # Wait for application startup
          sleep 10
          
          # Warm up the application
          echo "🔥 Warming up application..."
          for i in {1..10}; do
            curl -s http://localhost:3000/health > /dev/null
          done
          
          # Run autocannon benchmarks
          echo "📊 Running autocannon benchmarks..."
          npx autocannon \
            --connections 10 \
            --duration 30 \
            --json \
            http://localhost:3000/health \
            > performance-results/autocannon-health.json
          
          npx autocannon \
            --connections 10 \
            --duration 30 \
            --json \
            http://localhost:3000/hello \
            > performance-results/autocannon-hello.json
          
          # Stop application
          kill $APP_PID || true
          
          echo "✅ Response time benchmarking completed"
      
      # PM2 cluster mode performance testing
      - name: "🔄 PM2 Cluster Performance Testing"
        working-directory: src/backend
        run: |
          echo "🔄 Testing PM2 cluster mode performance..."
          
          # Install PM2 globally for testing
          npm install -g pm2
          
          # Start application in cluster mode
          pm2 start ecosystem.config.js --env production
          
          # Wait for cluster startup
          sleep 15
          
          # Test cluster performance
          echo "📊 Testing cluster performance..."
          npx autocannon \
            --connections 50 \
            --duration 60 \
            --json \
            http://localhost:3000/health \
            > performance-results/cluster-performance.json
          
          # Get PM2 status
          pm2 list > performance-results/pm2-status.txt
          pm2 monit --json > performance-results/pm2-monitoring.json &
          PM2_MONITOR_PID=$!
          sleep 10
          kill $PM2_MONITOR_PID || true
          
          # Stop PM2 processes
          pm2 delete all
          
          echo "✅ PM2 cluster performance testing completed"
      
      # Memory usage and resource monitoring
      - name: "💾 Memory Usage Monitoring"
        working-directory: src/backend
        run: |
          echo "💾 Monitoring memory usage patterns..."
          
          # Start application with memory monitoring
          NODE_ENV=test node --expose-gc scripts/memory-monitor.js &
          MONITOR_PID=$!
          
          # Run load test while monitoring memory
          sleep 5
          npx autocannon \
            --connections 20 \
            --duration 45 \
            http://localhost:3000/hello &
          
          # Wait for test completion
          sleep 50
          
          # Stop monitoring
          kill $MONITOR_PID || true
          
          echo "✅ Memory usage monitoring completed"
      
      # Generate performance educational insights
      - name: "💡 Generate Performance Educational Insights"
        working-directory: src/backend
        run: |
          echo "💡 Generating performance educational insights..."
          
          mkdir -p insights/performance
          
          # Extract performance metrics
          HEALTH_RPS=$(cat performance-results/autocannon-health.json | jq -r '.requests.average')
          HELLO_RPS=$(cat performance-results/autocannon-hello.json | jq -r '.requests.average')
          CLUSTER_RPS=$(cat performance-results/cluster-performance.json | jq -r '.requests.average')
          
          cat > insights/performance/analysis.md << EOF
          # Performance Testing Analysis
          
          ## Response Time Benchmarking
          - **Health Endpoint**: ${HEALTH_RPS} requests/second average
          - **Hello Endpoint**: ${HELLO_RPS} requests/second average
          - **Cluster Mode**: ${CLUSTER_RPS} requests/second average
          
          ## Performance Testing Tools
          - **Autocannon**: Fast HTTP/1.1 benchmarking tool
          - **Artillery**: Advanced load testing with scenarios
          - **PM2 Monitoring**: Production process monitoring
          
          ## Cluster Mode Benefits
          - **Scalability**: Utilizes multiple CPU cores
          - **Fault Tolerance**: Process isolation and restart
          - **Load Distribution**: Automatic request balancing
          
          ## Performance Targets
          - **Response Time**: < 100ms average (95th percentile)
          - **Throughput**: > 1000 requests/second
          - **Memory Usage**: < 200MB per process
          - **CPU Utilization**: < 80% sustained
          
          ## Learning Outcomes
          - Understanding Node.js performance characteristics
          - Implementing cluster mode for scalability
          - Monitoring application performance metrics
          - Establishing performance testing automation
          - Optimizing for production workloads
          EOF
          
          echo "✅ Performance educational insights generated"
      
      # Upload performance testing results
      - name: "📊 Upload Performance Results"
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-benchmarking-results
          path: |
            src/backend/performance-results/
            src/backend/insights/performance/
          retention-days: 30

  # Coverage Analysis and Aggregation Job
  coverage-analysis-aggregation:
    name: "📊 Coverage Analysis & Aggregation"
    runs-on: ubuntu-latest
    needs: [setup-environment, jest-comprehensive-testing, mocha-modular-testing]
    timeout-minutes: 10
    if: always() && (needs.jest-comprehensive-testing.result == 'success' || needs.mocha-modular-testing.result == 'success')
    
    steps:
      # Repository checkout for coverage analysis
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      # Setup Node.js for coverage analysis
      - name: "⚡ Setup Node.js for Coverage Analysis"
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'src/backend/package-lock.json'
      
      # Download all coverage artifacts
      - name: "📥 Download Coverage Artifacts"
        uses: actions/download-artifact@v3
        with:
          path: coverage-artifacts/
      
      # Install coverage analysis dependencies
      - name: "📦 Install Coverage Analysis Dependencies"
        working-directory: src/backend
        run: |
          npm ci --production=false
          npm install --save-dev lcov-result-merger@latest
          echo "📦 Coverage analysis dependencies installed"
      
      # Aggregate coverage from all frameworks and platforms
      - name: "📊 Aggregate Coverage Results"
        working-directory: src/backend
        run: |
          echo "📊 Aggregating coverage results from all frameworks..."
          
          # Create aggregated coverage directory
          mkdir -p coverage/aggregated
          
          # Find and merge all LCOV files
          find ../coverage-artifacts -name "lcov.info" -exec cat {} \; > coverage/aggregated/merged.lcov
          
          # Generate aggregated coverage report
          if command -v genhtml &> /dev/null; then
            genhtml coverage/aggregated/merged.lcov \
              --output-directory coverage/aggregated/html \
              --title "Aggregated Test Coverage" \
              --prefix $(pwd) \
              --show-details \
              --legend
          fi
          
          echo "✅ Coverage aggregation completed"
      
      # Validate coverage thresholds
      - name: "🎯 Validate Coverage Thresholds"
        working-directory: src/backend
        run: |
          echo "🎯 Validating coverage thresholds..."
          
          # Execute coverage validation script
          node scripts/coverage.js --validate --threshold=${{ env.COVERAGE_THRESHOLD }}
          
          echo "✅ Coverage threshold validation completed"
      
      # Generate comprehensive coverage educational insights
      - name: "💡 Generate Coverage Educational Insights"
        working-directory: src/backend
        run: |
          echo "💡 Generating coverage educational insights..."
          
          mkdir -p insights/coverage
          
          cat > insights/coverage/analysis.md << EOF
          # Test Coverage Analysis
          
          ## Coverage Aggregation Strategy
          - **Multi-Framework**: Combining Jest and Mocha coverage results
          - **Cross-Platform**: Coverage from Ubuntu, Windows, and macOS
          - **Tool Comparison**: Jest built-in vs C8/NYC external tools
          
          ## Coverage Metrics
          - **Statements**: Individual executable statements
          - **Branches**: Conditional logic paths (if/else, switch, ternary)
          - **Functions**: Function and method declarations
          - **Lines**: Physical lines of code
          
          ## Quality Gates
          - **Minimum Threshold**: ${{ env.COVERAGE_THRESHOLD }}% overall coverage
          - **Branch Coverage**: 85% minimum for conditional logic
          - **Function Coverage**: 95% minimum for all functions
          - **Line Coverage**: ${{ env.COVERAGE_THRESHOLD }}% minimum for executed lines
          
          ## Educational Value
          - **Framework Comparison**: Understanding different coverage approaches
          - **Tool Selection**: When to use Jest vs external coverage tools
          - **Quality Assurance**: Setting appropriate coverage thresholds
          - **Continuous Integration**: Automating coverage validation
          
          ## Best Practices
          - Focus on meaningful coverage, not just high percentages
          - Test edge cases and error conditions
          - Maintain coverage over time with quality gates
          - Use coverage to identify untested code paths
          EOF
          
          echo "✅ Coverage educational insights generated"
      
      # Upload aggregated coverage results
      - name: "📊 Upload Aggregated Coverage"
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: aggregated-coverage-analysis
          path: |
            src/backend/coverage/aggregated/
            src/backend/insights/coverage/
          retention-days: 90
      
      # Upload final coverage to Codecov
      - name: "📈 Upload Aggregated Coverage to Codecov"
        uses: codecov/codecov-action@v3
        if: success()
        with:
          file: src/backend/coverage/aggregated/merged.lcov
          flags: aggregated,comprehensive
          name: aggregated-coverage
          fail_ci_if_error: true
          verbose: true
          directory: src/backend
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

