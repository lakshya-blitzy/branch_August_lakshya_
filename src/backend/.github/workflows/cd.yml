      # Send deployment success notification with comprehensive details
      - name: "✅ Send Deployment Success Notification"
        if: needs.production-deployment.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { context, github } = require('@actions/github');
            
            // Collect successful deployment information
            const deploymentInfo = {
              sha: context.sha.substring(0, 7),
              ref: context.ref,
              actor: context.actor,
              timestamp: new Date().toISOString(),
              environment: '${{ needs.deployment-gate-validation.outputs.environment-target }}',
              strategy: '${{ needs.deployment-gate-validation.outputs.deployment-strategy }}',
              productionUrl: '${{ needs.production-deployment.outputs.production-url }}',
              productionHealth: '${{ needs.production-deployment.outputs.production-health }}',
              stagingUrl: '${{ needs.staging-deployment.outputs.staging-url }}',
              clusterStatus: '${{ needs.production-deployment.outputs.pm2-cluster-status }}'
            };
            
            const successBody = `## 🚀 Production Deployment Successful
            
            **Deployment Information:**
            - **Commit**: ${deploymentInfo.sha}
            - **Branch**: ${deploymentInfo.ref}
            - **Deployed By**: ${deploymentInfo.actor}
            - **Timestamp**: ${deploymentInfo.timestamp}
            - **Environment**: ${deploymentInfo.environment}
            
            **Deployment Results:**
            - **Production URL**: ${deploymentInfo.productionUrl} ✅
            - **Health Status**: ${deploymentInfo.productionHealth} ✅
            - **PM2 Cluster**: ${deploymentInfo.clusterStatus} ✅
            - **Staging URL**: ${deploymentInfo.stagingUrl} ✅
            
            **Deployment Strategy:**
            - **Strategy**: ${deploymentInfo.strategy}
            - **PM2 Cluster Mode**: Active with automatic load balancing
            - **Zero Downtime**: Achieved through sequential process restart
            - **Health Monitoring**: Comprehensive validation completed
            
            **Performance Metrics:**
            - **Cluster Instances**: Multiple workers active
            - **Memory Usage**: Within optimal limits
            - **Response Time**: Meeting performance targets
            - **Uptime**: 100% availability maintained
            
            **Security Validation:**
            - **Vulnerability Scan**: Passed ✅
            - **Security Headers**: Configured with Helmet.js ✅
            - **Configuration**: Validated and secure ✅
            
            **Educational Value Achieved:**
            This deployment successfully demonstrates:
            - Modern CI/CD pipeline implementation with GitHub Actions
            - PM2 cluster mode deployment with zero-downtime strategies
            - Multi-environment deployment promotion (staging to production)
            - Comprehensive health monitoring and validation throughout deployment
            - Security-aware deployment with vulnerability scanning and header validation
            - Automated rollback capabilities for deployment failure recovery
            - Cross-platform deployment coordination and educational comparison
            - Production-ready deployment with enterprise-grade monitoring and reporting
            
            **Monitoring and Maintenance:**
            - **Continuous Monitoring**: Active
            - **Health Endpoints**: Responding normally
            - **PM2 Dashboard**: Available for real-time monitoring
            - **Log Aggregation**: Configured and operational
            
            **Next Steps:**
            - Monitor application performance and health metrics
            - Review deployment artifacts and educational insights
            - Apply lessons learned to future deployment improvements
            - Continue exploring advanced PM2 and deployment features
            
            **Artifacts Available:**
            - Comprehensive deployment reports
            - Educational insights and analysis
            - Performance metrics and benchmarks
            - Health check results and recommendations
            
            ---
            
            🎓 **Educational Mission Accomplished**: This deployment successfully demonstrates modern Node.js application deployment practices with PM2, comprehensive health monitoring, and production-ready automation.
            
            🔗 **Quick Links:**
            - Production: ${deploymentInfo.productionUrl}
            - Staging: ${deploymentInfo.stagingUrl}
            - Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            
            // Create success notification issue
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚀 Production Deployment Successful - ${deploymentInfo.sha}`,
              body: successBody,
              labels: ['deployment', 'success', 'production', 'pm2', 'nodejs-tutorial', 'educational']
            });
            
            console.log(`Success notification issue created: #${issue.data.number}`);
            console.log(`Issue URL: ${issue.data.html_url}`);
        
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Send deployment failure notification with detailed analysis
      - name: "❌ Send Deployment Failure Notification"
        if: needs.production-deployment.result == 'failure' || needs.staging-deployment.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { context, github } = require('@actions/github');
            
            // Collect failure information
            const failureInfo = {
              sha: context.sha.substring(0, 7),
              ref: context.ref,
              actor: context.actor,
              timestamp: new Date().toISOString(),
              environment: '${{ needs.deployment-gate-validation.outputs.environment-target }}',
              strategy: '${{ needs.deployment-gate-validation.outputs.deployment-strategy }}',
              stagingResult: '${{ needs.staging-deployment.result }}',
              productionResult: '${{ needs.production-deployment.result }}',
              rollbackEnabled: '${{ github.event.inputs.enable_rollback || true }}'
            };
            
            const failureBody = `## ❌ Deployment Failure Detected
            
            **Failure Information:**
            - **Failed Commit**: ${failureInfo.sha}
            - **Branch**: ${failureInfo.ref}
            - **Attempted By**: ${failureInfo.actor}
            - **Failure Time**: ${failureInfo.timestamp}
            - **Target Environment**: ${failureInfo.environment}
            
            **Deployment Results:**
            - **Staging Result**: ${failureInfo.stagingResult} ${failureInfo.stagingResult === 'success' ? '✅' : '❌'}
            - **Production Result**: ${failureInfo.productionResult} ${failureInfo.productionResult === 'success' ? '✅' : '❌'}
            - **Rollback Status**: ${failureInfo.rollbackEnabled === 'true' ? '🔄 Executed' : '⏭️ Skipped'}
            
            **Immediate Actions Taken:**
            ${failureInfo.rollbackEnabled === 'true' ? 
              '- [x] Automatic rollback initiated\n- [x] Previous stable version restored\n- [x] Service availability maintained' : 
              '- [ ] Manual rollback required\n- [ ] Service may be impacted\n- [ ] Immediate attention needed'}
            
            **Investigation Required:**
            1. **Review Deployment Logs**: Check workflow artifacts for detailed error information
            2. **Analyze Health Check Failures**: Review health check results and recommendations
            3. **Validate PM2 Configuration**: Ensure ecosystem configuration is correct
            4. **Check Security Validation**: Review security scan results for blocking issues
            5. **Environment Assessment**: Validate target environment prerequisites
            
            **Common Failure Scenarios:**
            - **Health Check Failures**: Application not responding to health endpoints
            - **PM2 Configuration Issues**: Invalid ecosystem configuration or startup problems
            - **Security Gate Violations**: Critical vulnerabilities or security misconfigurations
            - **Resource Constraints**: Insufficient memory, CPU, or disk space
            - **Network Connectivity**: Unable to reach deployment targets or dependencies
            
            **Next Steps for Resolution:**
            1. **Fix Identified Issues**: Address root cause problems in staging environment
            2. **Validate Fixes**: Run comprehensive tests to ensure issues are resolved
            3. **Re-attempt Deployment**: Use workflow dispatch to retry deployment
            4. **Update Procedures**: Improve deployment process based on lessons learned
            5. **Team Review**: Conduct post-incident analysis and documentation
            
            **Educational Value - Learning from Failures:**
            This deployment failure demonstrates:
            - Importance of comprehensive health validation
            - Value of automated rollback capabilities
            - Need for robust deployment gate validation
            - Critical role of security scanning in deployment pipeline
            - Benefits of multi-environment promotion strategy
            
            **Debugging Resources:**
            - **Workflow Logs**: Available in GitHub Actions run
            - **Health Check Reports**: Generated during deployment process
            - **PM2 Status**: Check process manager state and logs
            - **Security Scan Results**: Review vulnerability and configuration reports
            - **System Metrics**: Analyze resource usage and performance data
            
            **Emergency Contacts:**
            If immediate assistance is required for production service restoration:
            - Contact deployment team lead
            - Escalate to infrastructure team if needed
            - Use emergency deployment procedures if critical
            
            **Rollback Information:**
            ${failureInfo.rollbackEnabled === 'true' ? 
              'Automatic rollback was executed. Check rollback artifacts for detailed status and validation results.' : 
              'Automatic rollback was not enabled. Manual intervention may be required to restore service.'}
            
            ---
            
            🔍 **Investigation Priority**: ${failureInfo.productionResult === 'failure' ? 'HIGH - Production Impact' : 'MEDIUM - Staging Failure'}
            
            📋 **Detailed Analysis**: Review workflow artifacts and logs for comprehensive failure analysis and debugging information.`;
            
            // Create failure notification issue
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Deployment Failure - ${failureInfo.sha} - Investigation Required`,
              body: failureBody,
              labels: ['deployment', 'failure', 'investigation-required', 'nodejs-tutorial', failureInfo.productionResult === 'failure' ? 'production' : 'staging']
            });
            
            console.log(`Failure notification issue created: #${issue.data.number}`);
            console.log(`Issue URL: ${issue.data.html_url}`);
        
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Archive comprehensive deployment report and educational materials
      - name: "📦 Archive Comprehensive Deployment Report"
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-deployment-report
          path: |
            src/backend/comprehensive-deployment-report.json
            src/backend/educational-deployment-insights.json
            deployment-artifacts/
          retention-days: 365  # Keep comprehensive reports for extended period

