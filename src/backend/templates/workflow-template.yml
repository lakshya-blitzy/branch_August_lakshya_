  # Workflow summary and notification job
  workflow_summary:
    name: Workflow Summary and Notifications
    runs-on: ubuntu-latest
    needs: [environment_validation, test_matrix, security_scanning, cross_platform_validation, pm2_deployment, performance_benchmarking, educational_insights]
    if: always()
    timeout-minutes: 10
    
    steps:
      - name: Gather Workflow Results
        run: |
          echo "Gathering comprehensive workflow results..."
          
          # Initialize result summary
          echo "WORKFLOW_SUMMARY<<EOF" >> $GITHUB_ENV
          echo "🎯 Node.js Tutorial CI/CD Workflow Summary" >> $GITHUB_ENV
          echo "============================================" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          
          # Environment validation results
          echo "🔧 Environment Validation: ${{ needs.environment_validation.result }}" >> $GITHUB_ENV
          
          # Test matrix results
          echo "🧪 Test Matrix: ${{ needs.test_matrix.result }}" >> $GITHUB_ENV
          
          # Security scanning results
          echo "🔒 Security Scanning: ${{ needs.security_scanning.result }}" >> $GITHUB_ENV
          
          # Cross-platform testing results
          echo "🔄 Cross-Platform Testing: ${{ needs.cross_platform_validation.result }}" >> $GITHUB_ENV
          
          # PM2 deployment results
          echo "🚀 PM2 Deployment: ${{ needs.pm2_deployment.result }}" >> $GITHUB_ENV
          
          # Performance testing results
          echo "⚡ Performance Testing: ${{ needs.performance_benchmarking.result }}" >> $GITHUB_ENV
          
          # Educational insights results
          echo "💡 Educational Insights: ${{ needs.educational_insights.result }}" >> $GITHUB_ENV
          
          echo "" >> $GITHUB_ENV
          echo "Workflow completed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          echo "Total duration: ${{ github.event.head_commit.timestamp && github.run_id }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      
      - name: Determine Overall Workflow Success
        run: |
          # Determine overall success based on critical job results
          CRITICAL_JOBS=("environment_validation" "test_matrix")
          OVERALL_SUCCESS=true
          
          for job in "${CRITICAL_JOBS[@]}"; do
            case "$job" in
              "environment_validation")
                if [[ "${{ needs.environment_validation.result }}" != "success" ]]; then
                  OVERALL_SUCCESS=false
                fi
                ;;
              "test_matrix")
                if [[ "${{ needs.test_matrix.result }}" != "success" ]]; then
                  OVERALL_SUCCESS=false
                fi
                ;;
            esac
          done
          
          echo "OVERALL_SUCCESS=$OVERALL_SUCCESS" >> $GITHUB_ENV
          
          if [[ "$OVERALL_SUCCESS" == "true" ]]; then
            echo "🎉 Workflow completed successfully with comprehensive validation"
          else
            echo "⚠️ Workflow completed with issues requiring attention"
          fi
      
      - name: Generate Workflow Completion Report
        run: |
          mkdir -p workflow-summary
          
          # Generate comprehensive workflow report
          cat > workflow-summary/completion-report.json << EOF
          {
            "workflow": {
              "name": "${{ env.WORKFLOW_NAME }}",
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "actor": "${{ github.actor }}",
              "event_name": "${{ github.event_name }}"
            },
            "results": {
              "overall_success": ${{ env.OVERALL_SUCCESS }},
              "environment_validation": "${{ needs.environment_validation.result }}",
              "test_matrix": "${{ needs.test_matrix.result }}",
              "security_scanning": "${{ needs.security_scanning.result }}",
              "cross_platform_validation": "${{ needs.cross_platform_validation.result }}",
              "pm2_deployment": "${{ needs.pm2_deployment.result }}",
              "performance_benchmarking": "${{ needs.performance_benchmarking.result }}",
              "educational_insights": "${{ needs.educational_insights.result }}"
            },
            "configuration": {
              "environment": "${{ inputs.environment || 'development' }}",
              "node_version": "${{ inputs.node_version || '22.x' }}",
              "test_framework": "${{ inputs.test_framework || 'both' }}",
              "coverage_threshold": "${{ inputs.coverage_threshold || '90' }}",
              "features_enabled": {
                "cross_platform": ${{ inputs.enable_cross_platform || true }},
                "pm2_deployment": ${{ inputs.enable_pm2_deployment || false }},
                "security_scanning": ${{ inputs.enable_security_scanning || true }},
                "performance_testing": ${{ inputs.enable_performance_testing || false }},
                "educational_insights": ${{ inputs.enable_educational_insights || true }}
              }
            },
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "recommendations": [
              "Review test results for any failures or warnings",
              "Check security scan results for vulnerabilities",
              "Analyze performance reports for optimization opportunities",
              "Study educational insights for learning enhancement"
            ]
          }
          EOF
      
      - name: Post Workflow Summary Comment (PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const summary = `${{ env.WORKFLOW_SUMMARY }}`;
            
            const comment = `## ${summary}
            
            ### 🎯 Workflow Configuration
            - **Environment**: ${{ inputs.environment || 'development' }}
            - **Node.js Version**: ${{ inputs.node_version || '22.x' }}
            - **Test Framework**: ${{ inputs.test_framework || 'both' }}
            - **Coverage Threshold**: ${{ inputs.coverage_threshold || '90' }}%
            
            ### 📊 Key Results
            - Environment validation and framework detection completed
            - Comprehensive testing across multiple Node.js versions
            - Security scanning and vulnerability assessment
            - Educational insights and learning recommendations generated
            
            ### 🔗 Workflow Artifacts
            Check the [Actions tab](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for detailed reports and logs.
            
            ---
            *Workflow completed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Upload Workflow Summary
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: workflow-summary
          path: workflow-summary/
          retention-days: 90
      
      - name: Final Status Output
        run: |
          echo "📋 Workflow Summary:"
          echo "${{ env.WORKFLOW_SUMMARY }}"
          
          if [[ "${{ env.OVERALL_SUCCESS }}" == "true" ]]; then
            echo "::notice title=Workflow Success::Node.js Tutorial CI/CD workflow completed successfully with comprehensive validation"
            exit 0
          else
            echo "::warning title=Workflow Issues::Node.js Tutorial CI/CD workflow completed with issues requiring attention"
            exit 1
          fi