#==============================================================================
# Test Configuration Properties
#==============================================================================
# Centralized configuration for Java-based HTTP integration tests
# Used by ServerManager utility and test suites in com.testinium.http package
#
# Purpose: Provides configurable test execution parameters, server connection
#          settings, performance validation thresholds, and expected response
#          values for testing the Node.js Express server
#
# References:
# - Section 0.4.2: Test configuration requirements
# - Section 0.5.1: Performance validation and coverage targets
# - Section 2.2: Functional requirements F-001, F-002, F-004, F-005
#==============================================================================

#------------------------------------------------------------------------------
# Server Connection Configuration (Section 0.4.2)
#------------------------------------------------------------------------------
# Base URL and port settings for HTTP integration tests
# Matches server.js configuration (line 104: PORT = process.env.PORT || 3000)

# Base URL for server connection
server.host=http://localhost

# Default server port matching server.js default configuration
server.port=3000

# Alternative test port for F-005-RQ-001 environment variable testing
# Used to validate PORT environment variable handling
test.port=8080

#------------------------------------------------------------------------------
# Test Execution Timeouts (Section 0.4.2)
#------------------------------------------------------------------------------
# Timeout values in milliseconds for robust test execution
# Prevents hanging tests and ensures timely failure detection

# Connection establishment timeout
test.timeout.connection=5000

# Socket read timeout for receiving response data
test.timeout.read=5000

# Overall test execution timeout
test.timeout.overall=10000

#------------------------------------------------------------------------------
# Performance Validation Thresholds (Section 0.5.1)
#------------------------------------------------------------------------------
# Performance requirements from F-001-RQ-003 and F-002-RQ-003
# Response time must be < 10ms for both endpoints

# Maximum acceptable response time in milliseconds
# Used to validate sub-10ms performance requirement
performance.threshold=10

# Number of concurrent requests for load testing
# Tests server capacity to handle simultaneous requests
performance.concurrency.requests=100

# Number of throughput test requests
# Validates server can handle 1000+ requests/second target
performance.throughput.requests=1000

#------------------------------------------------------------------------------
# Expected Response Values (F-001, F-002 Functional Requirements)
#------------------------------------------------------------------------------
# Expected response strings for endpoint validation
# Must match exact responses defined in server.js

# Expected response for GET / endpoint (F-001-RQ-001)
# Corresponds to server.js line 50: res.send('Hello world')
response.hello=Hello world

# Expected response for GET /evening endpoint (F-002-RQ-001)
# Corresponds to server.js line 65: res.send('Good evening')
response.evening=Good evening

#------------------------------------------------------------------------------
# Error Message Constants (F-004 Functional Requirements)
#------------------------------------------------------------------------------
# Expected error messages for 404 and 500 error handler testing

# Expected 404 error message (F-004-RQ-001)
# Corresponds to server.js line 81: res.status(404).send('Not Found')
error.notfound=Not Found

# Expected 500 error message (F-004-RQ-002)
# Corresponds to server.js line 100: res.status(500).send('Internal Server Error')
error.internal=Internal Server Error

#------------------------------------------------------------------------------
# HTTP Headers Configuration
#------------------------------------------------------------------------------
# Expected and test HTTP headers for validation

# Expected content type for text responses
header.contenttype.text=text/html; charset=utf-8

# User agent string for test requests
header.useragent=Java-HTTP-Integration-Tests/1.0

#------------------------------------------------------------------------------
# Test Execution Configuration
#------------------------------------------------------------------------------
# General test execution parameters

# Enable verbose logging during test execution
test.logging.verbose=false

# Number of retry attempts for flaky network operations
test.retry.attempts=3

# Delay between retry attempts in milliseconds
test.retry.delay=1000

#------------------------------------------------------------------------------
# Server Lifecycle Configuration
#------------------------------------------------------------------------------
# Parameters for server process management in ServerLifecycleTest

# Maximum time to wait for server startup in milliseconds
server.startup.timeout=10000

# Maximum time to wait for server shutdown in milliseconds
server.shutdown.timeout=5000

# Delay after server startup before running tests in milliseconds
server.startup.delay=2000

#------------------------------------------------------------------------------
# Edge Case Test Configuration
#------------------------------------------------------------------------------
# Parameters for boundary and edge case testing

# Maximum URL length for malformed URL tests
edge.url.maxlength=2048

# Number of large payload test iterations
edge.payload.iterations=10

# Size of large payload in bytes for stress testing
edge.payload.size=1048576

#==============================================================================
# End of Configuration
#==============================================================================
